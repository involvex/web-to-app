<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 16px;
        color: var(--wta-on-surface, #1f2937);
      }
      .wta-video-section {
        margin-bottom: 16px;
      }
      .wta-video-section-title {
        font-size: 14px;
        color: var(--wta-on-surface-variant, #6b7280);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wta-video-empty {
        text-align: center;
        padding: 40px;
        color: var(--wta-on-surface-variant, #9ca3af);
      }
      .wta-video-empty-icon {
        font-size: 28px;
        margin-bottom: 10px;
      }
      .wta-video-feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .wta-video-feature-btn {
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: var(--wta-surface-dim, #f3f4f6);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--wta-on-surface, #374151);
        transition: all 0.2s;
      }
      .wta-video-feature-btn:active {
        background: var(--wta-accent-soft, rgba(99, 102, 241, 0.1));
      }
      .wta-video-feature-icon {
        font-size: 20px;
      }
      .wta-stream-pip-panel {
        padding: 4px;
      }
      .wta-stream-pip-list {
        max-height: 240px;
        overflow-y: auto;
        margin-bottom: 12px;
      }
      .wta-stream-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: var(--wta-surface-dim, #f9fafb);
        border-radius: 8px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .wta-stream-item-icon {
        font-size: 18px;
      }
      .wta-stream-item-info {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wta-stream-item-btn {
        background: var(--wta-accent, #6366f1);
        color: #fff;
        border: none;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .wta-spip-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--wta-surface-dim, #f9fafb);
        margin-bottom: 8px;
      }
      .wta-spip-toggle-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .wta-spip-toggle-title {
        font-size: 14px;
        color: var(--wta-on-surface, #374151);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wta-spip-toggle-desc {
        font-size: 11px;
        color: var(--wta-on-surface-variant, #9ca3af);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wta-spip-chip {
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
      }
      .wta-spip-chip-on {
        background: var(--wta-accent-soft, rgba(99, 102, 241, 0.12));
        color: var(--wta-accent, #6366f1);
      }
      .wta-spip-chip-off {
        background: var(--wta-outline, #e5e7eb);
        color: var(--wta-on-surface-variant, #9ca3af);
      }
      #wta-toast {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        background: #111827;
        color: #fff;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 90%;
      }
      #wta-toast.show {
        opacity: 0.95;
      }
    </style>
    <script type="hcj/page">

      (function() {
          'use strict';
          if (window.__wtaSpipInit) return;
          window.__wtaSpipInit = true;

          var ACT = {};
          // Feedback goes to the page toast AND the panel toast — whichever is visible.
          function toast(m) { hcj.toast(m); hcj.panel.send({ type: 'toast', msg: String(m) }); }
          function pushPanel() { hcj.panel.send({ type: 'panel', html: getPanelHtml() }); }

          var LANG = (hcj.lang || 'zh').toLowerCase();
          LANG = LANG.indexOf('ar') === 0 ? 'ar' : LANG.indexOf('zh') === 0 ? 'zh' :
              LANG.indexOf('pt') === 0 ? 'pt' : LANG.indexOf('es') === 0 ? 'es' :
              LANG.indexOf('fr') === 0 ? 'fr' : LANG.indexOf('de') === 0 ? 'de' :
              LANG.indexOf('ru') === 0 ? 'ru' : LANG.indexOf('ja') === 0 ? 'ja' :
              LANG.indexOf('ko') === 0 ? 'ko' : 'en';
          var I18N = {
              zh: { name: '流媒体画中画', videosTitle: '检测到的视频', none: '未检测到视频', pipOn: '已开启画中画', pipOff: '已退出画中画', pipUnavail: '画中画不可用', startAll: '全部启用画中画', stopAll: '全部退出画中画', autoTitle: '自动画中画', autoDesc: '视频播放时自动进入画中画', autoOn: '自动画中画: 已开启', autoOff: '自动画中画: 已关闭', on: '开', off: '关' },
              en: { name: 'Streaming PiP', videosTitle: 'Detected videos', none: 'No video found', pipOn: 'PiP enabled', pipOff: 'PiP exited', pipUnavail: 'PiP unavailable', startAll: 'Enable all PiP', stopAll: 'Exit all PiP', autoTitle: 'Auto PiP', autoDesc: 'Auto-enter PiP when video plays', autoOn: 'Auto PiP: On', autoOff: 'Auto PiP: Off', on: 'On', off: 'Off' },
              ar: { name: 'بث صورة داخل صورة', videosTitle: 'فيديوهات مكتشفة', none: 'لا يوجد فيديو', pipOn: 'تم تفعيل PiP', pipOff: 'تم إنهاء PiP', pipUnavail: 'PiP غير متاح', startAll: 'تمكيل كل PiP', stopAll: 'إنهاء كل PiP', autoTitle: 'PiP تلقائي', autoDesc: 'أدخل PiP تلقائياً عند تشغيل الفيديو', autoOn: 'البث التلقائي PiP: مفعل', autoOff: 'البث التلقائي PiP: غير مفعل', on: 'مفعل', off: 'متوقف' },
              pt: { name: 'Streaming PiP', videosTitle: 'Vídeos detectados', none: 'Nenhum vídeo', pipOn: 'PiP ativado', pipOff: 'PiP encerrado', pipUnavail: 'PiP indisponível', startAll: 'Ativar todos PiP', stopAll: 'Encerrar todos PiP', autoTitle: 'PiP automático', autoDesc: 'Auto-entrar PiP quando o vídeo tocar', autoOn: 'PiP automático: Ativado', autoOff: 'PiP automático: Desativado', on: 'Ativado', off: 'Desativado' },
              es: { name: 'Streaming en imagen emergente', videosTitle: 'Videos detectados', none: 'Sin video', pipOn: 'PiP activado', pipOff: 'PiP cerrado', pipUnavail: 'PiP no disponible', startAll: 'Activar todos PiP', stopAll: 'Cerrar todos PiP', autoTitle: 'PiP automático', autoDesc: 'Entrada automática a PiP al reproducir', autoOn: 'PiP automático: Activado', autoOff: 'PiP automático: Desactivado', on: 'Activado', off: 'Desactivado' },
              fr: { name: "Diffusion image dans l'image", videosTitle: 'Vidéos détectées', none: 'Aucune vidéo', pipOn: 'PiP activé', pipOff: 'PiP quitté', pipUnavail: 'PiP indisponible', startAll: 'Activer toutes PiP', stopAll: 'Quitter toutes PiP', autoTitle: 'PiP automatique', autoDesc: 'Entrée automatique PiP lors de la lecture', autoOn: 'PiP automatique: Activé', autoOff: 'PiP automatique: Désactivé', on: 'Activé', off: 'Désactivé' },
              de: { name: 'Streaming Bild-in-Bild', videosTitle: 'Erkannte Videos', none: 'Kein Video', pipOn: 'PiP aktiviert', pipOff: 'PiP verlassen', pipUnavail: 'PiP nicht verfügbar', startAll: 'Alle PiP aktivieren', stopAll: 'Alle PiP verlassen', autoTitle: 'Auto-PiP', autoDesc: 'Automatisch PiP bei Videostart', autoOn: 'Auto PiP: Aktiv', autoOff: 'Auto PiP: Inaktiv', on: 'An', off: 'Aus' },
              ru: { name: 'Транслировать PiP', videosTitle: 'Найденные видео', none: 'Видео не найдено', pipOn: 'PiP включен', pipOff: 'PiP выключен', pipUnavail: 'PiP недоступен', startAll: 'Включить все PiP', stopAll: 'Выключить все PiP', autoTitle: 'Авто-PiP', autoDesc: 'Автоматически включать PiP при воспроизведении', autoOn: 'Авто PiP: Вкл', autoOff: 'Авто PiP: Выкл', on: 'Вкл', off: 'Выкл' },
              ja: { name: 'ストリーミング PiP', videosTitle: '検出されたビデオ', none: 'ビデオが見つかりません', pipOn: 'PiP を有効化しました', pipOff: 'PiP を終了しました', pipUnavail: 'PiP は利用できません', startAll: 'すべての PiP を有効化', stopAll: 'すべての PiP を終了', autoTitle: '自動 PiP', autoDesc: 'ビデオ再生時に自動で PiP に入る', autoOn: '自動 PiP: オン', autoOff: '自動 PiP: オフ', on: 'オン', off: 'オフ' },
              ko: { name: '스트리밍 PIP', videosTitle: '감지된 비디오', none: '비디오를 찾을 수 없음', pipOn: 'PIP 활성화됨', pipOff: 'PIP 종료됨', pipUnavail: 'PIP을 사용할 수 없음', startAll: '모든 PIP 활성화', stopAll: '모든 PIP 종료', autoTitle: '자동 PIP', autoDesc: '비디오 재생 시 자동으로 PIP 진입', autoOn: '자동 PIP: 켜짐', autoOff: '자동 PIP: 꺼짐', on: '켜짐', off: '꺼짐' }
          };
          var T = I18N[LANG] || I18N.en;

          var AUTO_KEY = 'wta_spip_auto';
          var autoEntry = true;
          try { var savedAuto = localStorage.getItem(AUTO_KEY); if (savedAuto !== null) autoEntry = savedAuto === '1'; } catch(e) {}
          function saveAuto() { try { localStorage.setItem(AUTO_KEY, autoEntry ? '1' : '0'); } catch(e) {} }

          var host = location.hostname;
          var isYouTube = host.indexOf('youtube.com') !== -1 || host.indexOf('youtu.be') !== -1;
          var isHls = function(src) { return typeof src === 'string' && (src.indexOf('.m3u8') !== -1 || src.indexOf('master.m3u') !== -1); };
          var isDash = function(src) { return typeof src === 'string' && (src.indexOf('.mpd') !== -1 || src.indexOf('dash') !== -1); };

          var activePipVideos = [];
          var observer = null;

          function getVideos() { return Array.prototype.slice.call(document.querySelectorAll('video')); }

          function detectStreamingSrc(v) {
              var srcAttr = v.src || (v.querySelector('source') ? v.querySelector('source').src : '');
              if (isYouTube) return 'youtube';
              if (isHls(srcAttr)) return 'hls';
              if (isDash(srcAttr)) return 'dash';
              return v.src ? 'mp4' : 'unknown';
          }

          function canEnterPiP(v) {
              if (!v) return false;
              if (document.pictureInPictureElement) return true;
              if (typeof NativeBridge !== 'undefined' && typeof NativeBridge.enterPiP === 'function') return true;
              if (typeof v.requestPictureInPicture === 'function') return true;
              return false;
          }

          function enterPiP(v) {
              if (!v) return false;
              if (document.pictureInPictureElement) {
                  if (document.pictureInPictureElement === v) { document.exitPictureInPicture(); return false; }
                  try { v.requestPictureInPicture(); return true; }
                  catch(e) { toast('[Streaming PiP] HTML5 PiP failed: ' + e); }
              }
              if (typeof NativeBridge !== 'undefined' && typeof NativeBridge.enterPiP === 'function') {
                  try { NativeBridge.enterPiP(); return true; }
                  catch(e) { toast('[Streaming PiP] Native PiP failed: ' + e); }
              }
              if (typeof v.requestPictureInPicture === 'function') {
                  v.requestPictureInPicture().catch(function() {});
                  return true;
              }
              return false;
          }

          function exitPiP(v) {
              if (document.pictureInPictureElement && v === document.pictureInPictureElement) { document.exitPictureInPicture(); }
          }

          function esc(s) {
              return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          }

          function videoLabel(v, i) {
              var src = v.currentSrc || v.src || '';
              var tail = src.split('/').pop().split('?')[0];
              var name = v.title || tail || ('Video ' + (i + 1));
              return esc(detectStreamingSrc(v)) + ' · ' + esc(name);
          }

          function autoToggleRow() {
              return '<div class="wta-spip-toggle">' +
                  '<div class="wta-spip-toggle-info">' +
                  '<div class="wta-spip-toggle-title">' + esc(T.autoTitle) +
                  '<span class="wta-spip-chip ' + (autoEntry ? 'wta-spip-chip-on' : 'wta-spip-chip-off') + '">' + (autoEntry ? esc(T.on) : esc(T.off)) + '</span></div>' +
                  '<div class="wta-spip-toggle-desc">' + esc(T.autoDesc) + '</div></div>' +
                  '<button class="wta-video-feature-btn" style="padding:8px 16px;flex-direction:row" data-wta-action="toggleAuto">' +
                  '<span style="font-size:16px">' + (autoEntry ? '⏵' : '⏹') + '</span></button></div>';
          }

          function getPanelHtml() {
              var vids = getVideos();
              var html = '<div class="wta-stream-pip-panel">' +
                  '<div class="wta-video-section"><div class="wta-video-section-title">' + esc(T.videosTitle) + '</div>';
              if (!vids.length) {
                  html += '<div class="wta-video-empty"><div class="wta-video-empty-icon">🎬</div><div>' + esc(T.none) + '</div></div>';
              } else {
                  html += '<div class="wta-stream-pip-list">' + vids.map(function(v, i) {
                      var on = activePipVideos.indexOf(v) !== -1;
                      return '<div class="wta-stream-item"><span class="wta-stream-item-icon">🎬</span>' +
                          '<div class="wta-stream-item-info">' + videoLabel(v, i) + '</div>' +
                          '<button class="wta-stream-item-btn" data-wta-action="togglePip" data-wta-arg="' + i + '">' + (on ? '✓' : '▶') + '</button></div>';
                  }).join('') + '</div>';
                  html += '<div class="wta-video-feature-grid">' +
                      '<button class="wta-video-feature-btn" data-wta-action="startAll"><span class="wta-video-feature-icon">⏵</span>' + esc(T.startAll) + '</button>' +
                      '<button class="wta-video-feature-btn" data-wta-action="stopAll"><span class="wta-video-feature-icon">⏹</span>' + esc(T.stopAll) + '</button>' +
                      '</div>';
              }
              return html + '</div>' + autoToggleRow() + '</div>';
          }

          function togglePiP(v) {
              var idx = activePipVideos.indexOf(v);
              var wasIn = idx !== -1;
              var ok = wasIn ? (exitPiP(v), false) : enterPiP(v);
              if (ok) { activePipVideos.push(v); toast(T.pipOn); }
              else { if (wasIn) activePipVideos.splice(idx, 1); if (!wasIn) toast(T.pipUnavail); else toast(T.pipOff); }
          }

          function startAll() { getVideos().forEach(function(v) { if (enterPiP(v) && activePipVideos.indexOf(v) === -1) activePipVideos.push(v); }); toast(T.pipOn); }
          function stopAll() { activePipVideos.slice().forEach(exitPiP); activePipVideos = []; toast(T.pipOff); }

          function handlePlay(e) {
              var v = e.target;
              if (!autoEntry || !canEnterPiP(v)) return;
              if (enterPiP(v)) { if (activePipVideos.indexOf(v) === -1) activePipVideos.push(v); toast(T.pipOn); }
          }

          function observe() {
              if (observer) observer.disconnect();
              var bind = function() {
                  getVideos().forEach(function(v) {
                      if (!v.__pipBound) { v.__pipBound = true; v.addEventListener('play', handlePlay); }
                  });
              };
              bind();
              if (document.body) {
                  observer = new MutationObserver(function() { bind(); });
                  observer.observe(document.body, { childList: true, subtree: true });
              }
          }

          ACT.togglePip = function(a) { var v = getVideos()[parseInt(a, 10) || 0]; if (v) togglePiP(v); };
          ACT.startAll = startAll;
          ACT.stopAll = stopAll;
          ACT.toggleAuto = function() { autoEntry = !autoEntry; saveAuto(); toast(autoEntry ? T.autoOn : T.autoOff); };

          hcj.panel.onMessage(function (m) {
              if (!m) return;
              if (m.cmd === 'refresh') { pushPanel(); return; }
              if (m.cmd === 'act' && ACT[m.action]) { ACT[m.action](m.arg || ''); pushPanel(); }
          });
          hcj.on('action', function () { hcj.panel.open(); });
          // SPA navigation swaps the <video> set — re-bind play hooks and refresh the panel.
          hcj.on('navigate', function () { observe(); pushPanel(); });

          function register() { observe(); }
          document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', register) : register();
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="wta-video-empty">
        <div class="wta-video-empty-icon">🎬</div>
        <div id="wta-spip-status">Looking for video...</div>
      </div>
    </div>
    <div id="wta-toast"></div>
    <script>
      var root = document.getElementById("root");
      var toastEl = document.getElementById("wta-toast");
      var toastTimer = null;

      function wire() {
        root.querySelectorAll("[data-wta-action]").forEach(function (el) {
          if (el.__wired) return;
          el.__wired = true;
          el.addEventListener("click", function (ev) {
            ev.preventDefault();
            hcjPanel.send({
              cmd: "act",
              action: el.getAttribute("data-wta-action"),
              arg: el.getAttribute("data-wta-arg") || "",
            });
          });
        });
      }

      function showToast(m) {
        toastEl.textContent = m;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 1800);
      }

      hcjPanel.onMessage(function (m) {
        if (!m) return;
        if (m.type === "panel" && typeof m.html === "string") {
          root.innerHTML = m.html;
          wire();
        } else if (m.type === "toast") showToast(m.msg || "");
      });

      hcjPanel.send({ cmd: "refresh" });
    </script>
  </body>
</html>
